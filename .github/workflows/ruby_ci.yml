name: Ruby CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: ${{ matrix.target }} / Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-gnu
            cpu: x86_64
            os: linux
            ruby: '4.0.6'
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu
            cpu: aarch64
            os: linux
            ruby: '4.0.6'
          - runner: macos-15
            target: arm64-darwin
            cpu: arm64
            os: darwin
            ruby: '4.0.6'
          - runner: ubuntu-24.04
            target: x86_64-linux-gnu
            cpu: x86_64
            os: linux
            ruby: '3.4'
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Verify runner architecture
      run: ruby -rrbconfig -e 'cpu, os = ARGV; abort RbConfig::CONFIG.inspect unless RbConfig::CONFIG["host_cpu"] == cpu && RbConfig::CONFIG["host_os"].include?(os)' '${{ matrix.cpu }}' '${{ matrix.os }}'
    - run: bundle exec rake
    - name: Build gem
      run: gem build h3.gemspec
    - name: Install and load the packaged native library
      shell: bash
      run: |
        gem install --local --ignore-dependencies --no-document ./h3-*.gem
        cd "$(mktemp -d)"
        ruby -e 'require "h3"; spec = Gem.loaded_specs.fetch("h3"); library = H3::Bindings::Base.send(:native_library); abort library unless library.start_with?(spec.extension_dir + File::SEPARATOR); cell = H3.from_geo_coordinates([37.5665, 126.9780], 9); abort unless H3.valid?(cell); puts library'
